name: Monitor de Editais Italianos

on:
  schedule:
    # Roda todo dia às 8h da manhã (horário de Brasília)
    - cron: '0 11 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Puxar os arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar as bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-generativeai

      - name: Rodar o cacador de editais
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SENHA_APP_GMAIL: ${{ secrets.SENHA_APP_GMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Salvar os resumos de IA no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch editais_conhecidos.json novos_editais.md
          git add editais_conhecidos.json novos_editais.md
          git commit -m "Adiciona novos resumos de editais gerados por IA" || echo "Sem alteracoes para commitar"
          git push || echo "Nada para publicar"
